name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the history scan test needs the full history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest

  secrets:
    name: secrets and personal-data scan (tree + history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Project scan, working tree
        run: python scripts/secrets_scan.py
      - name: Project scan, full git history
        run: python scripts/secrets_scan.py --history
      - name: gitleaks (tree and history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  install:
    name: clean install from the built wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shell script checks
        run: |
          bash -n install.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck install.sh
          bash install.sh --dry-run
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
      - name: Install into a clean venv and run on a fresh home
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          export NANO_AGENT_HOME="$(mktemp -d)/home"
          /tmp/clean/bin/nano-agent --version
          /tmp/clean/bin/nano-agent setup --non-interactive --provider fake --model fake-1 --skip-test --name CI
          /tmp/clean/bin/nano-agent doctor --offline
      - name: Installer end to end (private venv method)
        run: |
          export HOME="$(mktemp -d)"
          bash install.sh --yes --no-setup --from "$GITHUB_WORKSPACE"
          "$HOME/.local/bin/nano-agent" --version

  install-windows:
    name: Windows installer smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Windows installer syntax and dry run
        shell: pwsh
        run: |
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\install.ps1), [ref]$null, [ref]$parseErrors)
          if ($parseErrors) { throw ($parseErrors | Out-String) }
          .\install.ps1 -DryRun -From (Get-Location).Path
